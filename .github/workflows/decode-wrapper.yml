name: Decode Wrapper JAR

on:
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Base64 to JAR
        run: |
          mkdir -p gradle/wrapper
          base64 -d gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar

      - name: Upload decoded JAR
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-jar
          path: gradle/wrapper/gradle-wrapper.jar
