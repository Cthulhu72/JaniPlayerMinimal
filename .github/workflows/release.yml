on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Make gradlew executable
        run: chmod +x JaniPlayerMinimal/gradlew

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Release Apk
        run: JaniPlayerMinimal/gradlew assembleRelease

      - name: List APK files
        run: ls -R JaniPlayerMinimal/app/build/outputs/apk/

      - name: Upload Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: JaniPlayerMinimal/app/build/outputs/apk/release/*.apk
