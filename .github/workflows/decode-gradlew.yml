name: Decode gradlew

on:
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode gradlew.bat
        run: |
          base64 -d gradlew.bat.b64 > gradlew.bat

      - name: Decode gradlew
        run: |
          base64 -d gradlew.b64 > gradlew
          chmod +x gradlew

      - name: List files
        run: ls -l .
        - name: Decode gradle-wrapper.properties
        run: |
          mkdir -p gradle/wrapper
          base64 -d gradle-wrapper.properties.b64 > gradle/wrapper/gradle-wrapper.properties
        
